[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuwala"
version = "0.2.0"
description = "A unified, arbitrage-checked quantitative options and volatility research library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kuwala Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "duckdb>=0.9.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.6.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "maturin>=1.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Grevix/kuwala"
Repository = "https://github.com/Grevix/kuwala"
Issues = "https://github.com/Grevix/kuwala/issues"
Documentation = "https://github.com/Grevix/kuwala#readme"

[project.scripts]
kuwala = "kuwala.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kuwala*"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["reference_repos", "research", "build", "dist", ".venv", "venv", "target", "scala"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "reference_repos",
    "research",
    "build",
    "dist",
    ".venv",
    "venv",
    "target",
    "*.egg-info",
]
