name: Kuwala CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-core:
    name: Rust Core Build & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Test
        run: cargo test --workspace --no-default-features

  python-test:
    name: Python Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: rust-core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build Rust core
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff pytest pytest-cov
          pip install -e .
          maturin develop -m kuwala_core/Cargo.toml

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest -v --ignore=reference_repos tests/

      - name: Run 2-Minute Quickstart Smoke Test
        run: python examples/quickstart_2min.py

      - name: Run Reproducible Benchmark Suite
        run: |
          python benchmarks/benchmark_iv.py
          python benchmarks/benchmark_calibration.py

  package-validation:
    name: Package Build & Metadata Validation
    needs: [rust-core, python-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build & Validation Tools
        run: pip install build twine

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Twine Check Metadata
        run: twine check dist/*

      - name: Verify Wheel Contents (No Secrets, No Raw Datasets)
        run: |
          python -c "
          import zipfile, glob, sys
          wheels = glob.glob('dist/*.whl')
          for w in wheels:
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
                  forbidden = [n for n in names if '.env' in n or 'Blueprint' in n or 'research/data' in n]
                  if forbidden:
                      print(f'ERROR: Forbidden files found in wheel {w}: {forbidden}')
                      sys.exit(1)
          print('Package verification passed: Wheel is clean.')
          "
