name: Kuwala CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-core:
    name: Rust Core Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Test
        run: cargo test --workspace --no-default-features

  package-validation:
    name: Package Build & Test Validation
    needs: [rust-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine ruff pytest pytest-cov
          pip install -e .

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest -v --ignore=reference_repos tests/

      - name: Run 2-Minute Quickstart Smoke Test
        run: python examples/quickstart_2min.py

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Twine Check Metadata
        run: twine check dist/*

      - name: Verify Wheel Contents (No Secrets, No Raw Datasets)
        run: |
          python -c "
          import zipfile, glob, sys
          wheels = glob.glob('dist/*.whl')
          for w in wheels:
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
                  forbidden = [n for n in names if '.env' in n or 'Blueprint' in n or 'research/data' in n]
                  if forbidden:
                      print(f'ERROR: Forbidden files found in wheel {w}: {forbidden}')
                      sys.exit(1)
          print('Package verification passed: Wheel is clean.')
          "
