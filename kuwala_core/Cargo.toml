[package]
name = "kuwala_core"
version = "0.1.0"
edition = "2021"
authors = ["Kuwala Contributors"]
description = "High-performance Rust numerical core for Kuwala quantitative library"
license = "Apache-2.0"

[lib]
name = "kuwala_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
